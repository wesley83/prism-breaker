name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    name: Bun tests and release integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified October 15, 2026
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2 verified October 15, 2026
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Dependency advisories
        run: bun audit
      - name: Regenerate and reject stale checked-in artifacts
        run: |
          bun run build
          git diff --exit-code -- public policy-candidates
      - run: bun run release:check
