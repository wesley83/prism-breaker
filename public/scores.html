@schema Context url("https://pagelove.org/Context");
@schema HTTPResponse url("https://pagelove.org/HTTPResponse");
if (!Context.request.body.matches("^<li itemscope itemtype=\"https://sane-guild-8399[.]onpagelove[.]com/Run\"><meta itemprop=\"runKey\" content=\"[a-f0-9-]{36}\"><meta itemprop=\"player\" content=\"[A-Za-z0-9 _-]{2,16}\"><meta itemprop=\"score\" content=\"(0|[1-9][0-9]{0,5}|1000000)\"><meta itemprop=\"level\" content=\"([1-9]|1[0-6])\"><meta itemprop=\"mode\" content=\"(campaign|daily)\"><meta itemprop=\"day\" content=\"(all|[0-9]{4}-[0-9]{2}-[0-9]{2})\"><meta itemprop=\"seconds\" content=\"[1-9][0-9]{0,4}\">(<meta itemprop=\"submittedAt\" content=\"[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}[.][0-9]{3}Z\">)?</li>$")) {
 throw new HTTPResponse {status: 422, message: "<p>Submit one valid Prism Breaker run.</p>"}
}
</script></div></div><div hidden itemscope itemtype="https://pagelove.org/AuthorizationRule"><meta itemprop="actor" content="*"><meta itemprop="resource" content="/scores.html"><meta itemprop="method" content="DELETE"><meta itemprop="selector" content="#scores > li"><meta itemprop="action" content="Allow"></div>
<div hidden itemscope itemtype="https://pagelove.org/Trigger"><meta itemprop="resource" content="/scores.html"><meta itemprop="method" content="DELETE"><div itemprop="action" itemscope itemtype="https://pagelove.org/JavaScript/Module"><script itemprop="source" type="module">export default function(ctx) {
 const headers=ctx.request.headers,range=headers.Range ?? headers.range ?? headers.get?.('Range') ?? headers.get?.('range') ?? '';
 const match=/^selector=#scores > li:has\(meta\[itemprop="expiresAt"\]:value-less-than\("([0-9]{13})"\)\)$/.exec(range);
 if(!match || Number(match[1])>Date.now())throw {schema_url:'https://pagelove.org/HTTPResponse',status:403,body:'<p>Only expired scores can be deleted.</p>'};
 return true;
}</script></div></div>
<div hidden itemscope itemtype="https://pagelove.org/Processor"><meta itemprop="resource" content="/scores.html"><meta itemprop="method" content="GET"><div itemprop="when" itemscope itemtype="https://pagelove.org/JavaScript/Module"><script itemprop="source" type="module">export default ctx => [...String(ctx.response.body).matchAll(/itemprop="expiresAt" content="([0-9]{13})"/g)].some(m=>Number(m[1])<Date.now());</script></div><div itemprop="action" itemscope itemtype="https://pagelove.org/HttpRequest"><meta itemprop="url" content="https://sane-guild-8399.onpagelove.com/scores.html"><meta itemprop="method" content="DELETE"><meta itemprop="retry" content="1"><div itemprop="header" itemscope itemtype="https://pagelove.org/Pair"><meta itemprop="key" content="Range"><div itemprop="value" itemscope itemtype="https://pagelove.org/JavaScript/Module"><script itemprop="source" type="module">export default () => 'selector=#scores > li:has(meta[itemprop="expiresAt"]:value-less-than("'+Date.now()+'"))';</script></div></div></div></div></body></html>
